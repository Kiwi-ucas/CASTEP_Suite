[package]
name = "crystal-viewer"
version = "0.1.0"
edition = "2021"
description = "Interactive 3D crystal structure viewer for CASTEP Suite"

[dependencies]
bevy = "0.15"
bevy_egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
