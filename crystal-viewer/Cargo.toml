[package]
name = "crystal-viewer"
version = "0.1.0"
edition = "2021"
description = "Interactive 3D crystal structure viewer for CASTEP Suite"

[dependencies]
# Only the Bevy features we actually need (default-features disabled for faster compilation)
bevy = { version = "0.15", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_winit",
    "bevy_asset",
    "bevy_window",
    "bevy_sprite",         # required by bevy_egui
    "tonemapping_luts",    # required for default Camera3d tonemapping
    "multi_threaded",
    "png",
    "x11",                 # X11 display support
    "wayland",             # Wayland display support
] }
bevy_egui = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"
